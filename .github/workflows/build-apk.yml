name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: # Allows clicking "Run workflow" manually anytime

permissions:
  contents: write

jobs:
  build-android:
    name: Build Offline Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: ☕ Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17

      - name: 🤖 Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 📦 Install NPM Dependencies
        run: npm install

      - name: 🔨 Build React Web Assets (Vite)
        run: npm run build

      - name: 📱 Initialize & Sync Capacitor Android
        run: |
          npx cap add android
          npx cap sync android

      - name: ⚙️ Build Debug APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
          cd ..
          cp android/app/build/outputs/apk/debug/app-debug.apk DVMusic-Offline.apk

      - name: 📤 Upload APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DVMusic-Android-APK
          path: DVMusic-Offline.apk
          if-no-files-found: error
          retention-days: 30

      - name: 🚀 Publish GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: release-v${{ github.run_number }}
          name: "DV Music v1.${{ github.run_number }}.0 (Android APK)"
          body: |
            ## 🎵 DV Music — 100% Offline Android APK
            
            This APK was automatically built by GitHub Actions.
            
            ### 📱 How to install on your Android device:
            1. Download `DVMusic-Offline.apk` below.
            2. Open the downloaded file on your Android phone.
            3. Tap **Install** (if prompted, enable *"Allow installation from unknown sources"*).
            4. Launch **DV Music** and enjoy 100% offline playback with 8D Audio, 10-Band EQ, and Neon Visualizers!
          files: DVMusic-Offline.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
