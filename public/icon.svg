<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7e22ce"/>
      <stop offset="50%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#0f0728"/>
    </linearGradient>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="50%" stop-color="#e879f9"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="116" fill="none" stroke="#a855f7" stroke-width="6" opacity="0.4" />

  <!-- Outer Soundwaves circle -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="#a855f7" stroke-width="4" stroke-dasharray="10 14" opacity="0.4" />

  <!-- Glowing Play Icon Triangle -->
  <polygon points="216,160 360,256 216,352" fill="url(#neonGrad)" filter="url(#glow)" />

  <!-- 8D Orbit Audio Waveform dots -->
  <circle cx="256" cy="76" r="14" fill="#38bdf8" filter="url(#glow)" />
  <circle cx="256" cy="436" r="14" fill="#c084fc" filter="url(#glow)" />
</svg>
